[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "openvoice-studio"
version = "0.1.0"
description = "Local-first, open-source voice cloning & narration engine with HTTP API and MCP server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.13"
authors = [{ name = "Dalcio Garcia" }]
keywords = ["tts", "voice-cloning", "narration", "mcp", "local-first"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  # Speech engine (MIT, code and weights). Pinned: adapters are benchmarked per version.
  "chatterbox-tts==0.1.7",
  # resemble-perth (Chatterbox's watermarker) still imports pkg_resources, removed from newer setuptools.
  "setuptools>=70,<80",
  # Intelligibility metric for run_voice_evaluation (MIT). Model weights are downloaded by `setup --evaluation`.
  "faster-whisper>=1.1,<2",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "mcp>=1.10,<2",
  "soundfile>=0.12",
  "numpy>=1.24,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
openvoice-studio = "openvoice_studio.cli:main"

[project.urls]
Homepage = "https://github.com/Dalcio/openvoice-studio"

[tool.hatch.build.targets.wheel]
packages = ["src/openvoice_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
